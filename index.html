<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Drift</title>
    <style>
      :root {
        --abysse: #0e3b52;
        --profond: #1b5e73;
        --milieu: #3a8c98;
        --clair: #7cc6bf;
        --plafond: #cfefe3;
        --texte: #f6f2e8;
        --accent: #e8674a;
        --souffle: #9ee6c9;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--milieu);
        color: var(--texte);
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #ui > * { pointer-events: auto; }
      #ui > .core-toast, #ui > .core-debug { pointer-events: none; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at 50% 0%, var(--plafond) 0%, var(--clair) 28%, var(--milieu) 62%, var(--profond) 100%);
        transition: opacity 0.9s ease;
        z-index: 10;
      }
      #loading h1 {
        margin: 0;
        font-size: clamp(42px, 8vw, 96px);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 4px 30px rgba(14, 59, 82, 0.35);
      }
      #loading .track {
        width: min(320px, 60vw);
        height: 6px;
        border-radius: 3px;
        background: rgba(246, 242, 232, 0.25);
        overflow: hidden;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: var(--souffle);
        transition: width 0.25s ease;
      }
      #loading-label { min-height: 1.2em; opacity: 0.85; font-size: 15px; }
      #loading-start {
        display: none;
        font-size: 20px;
        padding: 12px 26px;
        border-radius: 999px;
        background: rgba(246, 242, 232, 0.16);
        border: 1px solid rgba(246, 242, 232, 0.5);
        animation: breathe 2.4s ease-in-out infinite;
      }
      #loading.ready { background: linear-gradient(rgba(14, 59, 82, 0.15), rgba(14, 59, 82, 0.45)); cursor: pointer; }
      #loading.ready .track { display: none; }
      #loading.ready #loading-start { display: block; }
      #loading.gone { opacity: 0; pointer-events: none; }
      #loading.failed #loading-bar { background: var(--accent); }
      @keyframes breathe { 50% { transform: scale(1.04); opacity: 0.8; } }
      .core-toast {
        position: fixed;
        top: 20px;
        left: 24px;
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(14, 59, 82, 0.55);
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .core-toast.show { opacity: 1; }
      .core-debug {
        position: fixed;
        top: 8px;
        right: 10px;
        font: 12px/1.3 ui-monospace, monospace;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <h1>Le Drift</h1>
      <div class="track"><div id="loading-bar"></div></div>
      <div id="loading-label">Mise en eau…</div>
      <div id="loading-start">Cliquer pour commencer</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
